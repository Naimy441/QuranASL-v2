<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512">
  <defs>
    <linearGradient id="qasl-app-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="qasl-app-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="qasl-app-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Squircle App Badge -->
  <rect width="32" height="32" rx="7.5" fill="url(#qasl-app-bg)" stroke="#27272a" stroke-width="1" />

  <!-- Left Mushaf Page / Signing Hand -->
  <path
    d="M15.5 24C12 21 7 18.5 7 12.5C7 8.5 10.5 7 14.5 8.8L15.5 24Z"
    fill="url(#qasl-app-fill)"
    stroke="url(#qasl-app-stroke)"
    stroke-width="1.6"
    stroke-linejoin="round"
  />

  <!-- Right Mushaf Page / Signing Hand -->
  <path
    d="M16.5 24C20 21 25 18.5 25 12.5C25 8.5 21.5 7 17.5 8.8L16.5 24Z"
    fill="url(#qasl-app-fill)"
    stroke="url(#qasl-app-stroke)"
    stroke-width="1.6"
    stroke-linejoin="round"
  />

  <!-- Sacred Spine -->
  <path
    d="M16 8.5V24.5"
    stroke="url(#qasl-app-stroke)"
    stroke-width="1.6"
    stroke-linecap="round"
  />

  <!-- Zenith Celestial Spark (✦) -->
  <path
    d="M16 4L16.7 5.5L18.2 6.2L16.7 6.9L16 8.4L15.3 6.9L13.8 6.2L15.3 5.5Z"
    fill="#2dd4bf"
  />
</svg>
